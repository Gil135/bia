<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World Simple App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a1a1a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 { color: #ff9900; margin-bottom: 20px; font-size: 2.5rem; }
    .card {
      background-color: #2d2d2d;
      border-radius: 10px;
      padding: 24px 32px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      max-width: 520px;
      width: 100%;
    }
    .card-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      margin-bottom: 16px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #3d3d3d;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: #aaa; font-size: 0.85rem; }
    .info-value {
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      font-weight: 600;
      background: #111;
      padding: 3px 10px;
      border-radius: 6px;
    }
    .loading { animation: pulse 1.5s ease-in-out infinite; color: #666; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .badge-aws   { background: #1a3a1a; color: #48bb78; border: 1px solid #48bb78; border-radius: 20px; padding: 3px 10px; font-size: 0.75rem; font-weight: 700; }
    .badge-local { background: #3a2a1a; color: #ed8936; border: 1px solid #ed8936; border-radius: 20px; padding: 3px 10px; font-size: 0.75rem; font-weight: 700; }
    .footer { margin-top: 16px; font-size: 0.72rem; color: #555; }
  </style>
</head>
<body>

  <h1>Hello World!</h1>

  <div class="card">
    <div class="card-title">☁️ AWS EC2 — Instance Info</div>

    <div class="info-row">
      <span class="info-label">Instance ID</span>
      <span class="info-value loading" id="instanceId">carregando...</span>
    </div>
    <div class="info-row">
      <span class="info-label">IP Local</span>
      <span class="info-value loading" id="localIp">carregando...</span>
    </div>
    <div class="info-row">
      <span class="info-label">IP Público</span>
      <span class="info-value loading" id="publicIp">carregando...</span>
    </div>
    <div class="info-row">
      <span class="info-label">Tipo</span>
      <span class="info-value loading" id="instanceType">carregando...</span>
    </div>
    <div class="info-row">
      <span class="info-label">Zona</span>
      <span class="info-value loading" id="az">carregando...</span>
    </div>
    <div class="info-row">
      <span class="info-label">Ambiente</span>
      <span id="environment">-</span>
    </div>
  </div>

  <p class="footer" id="timestamp"></p>

  <script>
    async function loadInstanceInfo() {
      try {
        // Chama a rota gerada pelo boot.js
        const res = await fetch('/api/instance-infos');
        const data = await res.json();

        // Preenche os campos — a API retorna JSON plano
        document.getElementById('instanceId').textContent   = data.instanceId   || 'N/A';
        document.getElementById('localIp').textContent      = data.localIp      || 'N/A';
        document.getElementById('publicIp').textContent     = data.publicIp     || 'N/A';
        document.getElementById('instanceType').textContent = data.instanceType  || 'N/A';
        document.getElementById('az').textContent           = data.availabilityZone || 'N/A';

        // Badge de ambiente
        const envEl = document.getElementById('environment');
        envEl.textContent  = data.environment;
        envEl.className    = data.isAWS ? 'badge-aws' : 'badge-local';

        // Remove loading
        document.querySelectorAll('.loading').forEach(el => el.classList.remove('loading'));

        // Timestamp
        document.getElementById('timestamp').textContent =
          'Atualizado em: ' + new Date().toLocaleString('pt-BR');

      } catch (err) {
        console.error('Erro ao buscar dados da instância:', err);
        document.querySelectorAll('.loading').forEach(el => {
          el.textContent = 'Erro';
          el.classList.remove('loading');
        });
      }
    }

    loadInstanceInfo();
  </script>

</body>
</html>
